name: Mecenas

on:
  workflow_dispatch:
  schedule:
    - cron: "*/10 8-22 * * *"

permissions:
  contents: read

jobs:
  responder:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Responder mensajes pendientes
        env:
          FIREBASE_DB_URL: ${{ secrets.FIREBASE_DB_URL }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL }}
        run: python mecenas.py

